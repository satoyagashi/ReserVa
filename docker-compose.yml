services:
  postgres:
    image: postgres:16-alpine
    container_name: reserva_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reserva_db
      POSTGRES_USER: reserva_user
      POSTGRES_PASSWORD: reserva_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reserva_user -d reserva_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
